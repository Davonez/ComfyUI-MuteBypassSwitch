[project]
name = "comfyui-mute-bypass-switch"
version = "2.0.0"
description = "Five pass-through switch nodes that keep a graph running when an upstream node is muted or bypassed: mute-bypass, A/B, multi-any merge, multi-channel merge and output fanout."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "koivis" }]
keywords = ["comfyui", "custom-nodes", "switch", "mute", "bypass", "fanout"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Davonez/ComfyUI-MuteBypassSwitch"
Repository = "https://github.com/Davonez/ComfyUI-MuteBypassSwitch"
"Issue Tracker" = "https://github.com/Davonez/ComfyUI-MuteBypassSwitch/issues"

# ComfyUI Registry 的展示信息（按需补 PublisherId 后即可 comfy node publish）
[tool.comfy]
DisplayName = "Mute Bypass Switch"
